<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="حاسبة عصرية بتصميم احترافي من EyadCode."
    />

    <meta name="theme-color" content="#070b14" />

    <title>EyadCode | Smart Calculator</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>

  <body class="page">
    <main class="calculator">
      <header class="calculator__header">
        <div class="calculator__brand">
          <span class="calculator__brand-icon" aria-hidden="true"> E </span>

          <div class="calculator__brand-info">
            <h1 class="calculator__title">EyadCode</h1>
            <p class="calculator__subtitle">SMART CALCULATOR</p>
          </div>
        </div>

        <span class="calculator__status" aria-label="جاهزة للاستخدام">
          <span class="calculator__status-dot"></span>
          ONLINE
        </span>
      </header>

      <section class="calculator__screen" aria-label="شاشة الحاسبة">
        <p class="calculator__screen-label">RESULT</p>

        <div
          class="calculator__expression"
          data-expression
          aria-label="العملية الحسابية"
        ></div>

        <output
          class="calculator__display"
          data-display
          aria-live="polite"
          aria-atomic="true"
          dir="ltr"
          >0</output
        >
      </section>

      <section class="calculator__buttons" aria-label="أزرار الحاسبة">
        <button
          class="calculator__button calculator__button--function"
          type="button"
          data-action="clear"
          aria-label="مسح الكل"
        >
          AC
        </button>

        <button
          class="calculator__button calculator__button--function"
          type="button"
          data-action="delete"
          aria-label="حذف آخر رقم"
        >
          DEL
        </button>

        <button
          class="calculator__button calculator__button--operator"
          type="button"
          data-value="%"
          aria-label="باقي القسمة"
        >
          %
        </button>

        <button
          class="calculator__button calculator__button--operator"
          type="button"
          data-value="/"
          aria-label="قسمة"
        >
          ÷
        </button>

        <button class="calculator__button" type="button" data-value="7">
          7
        </button>
        <button class="calculator__button" type="button" data-value="8">
          8
        </button>
        <button class="calculator__button" type="button" data-value="9">
          9
        </button>

        <button
          class="calculator__button calculator__button--operator"
          type="button"
          data-value="*"
          aria-label="ضرب"
        >
          ×
        </button>

        <button class="calculator__button" type="button" data-value="4">
          4
        </button>
        <button class="calculator__button" type="button" data-value="5">
          5
        </button>
        <button class="calculator__button" type="button" data-value="6">
          6
        </button>

        <button
          class="calculator__button calculator__button--operator"
          type="button"
          data-value="-"
          aria-label="طرح"
        >
          −
        </button>

        <button class="calculator__button" type="button" data-value="1">
          1
        </button>
        <button class="calculator__button" type="button" data-value="2">
          2
        </button>
        <button class="calculator__button" type="button" data-value="3">
          3
        </button>

        <button
          class="calculator__button calculator__button--operator"
          type="button"
          data-value="+"
          aria-label="جمع"
        >
          +
        </button>

        <button
          class="calculator__button calculator__button--zero"
          type="button"
          data-value="0"
        >
          0
        </button>

        <button
          class="calculator__button"
          type="button"
          data-value="."
          aria-label="فاصلة عشرية"
        >
          .
        </button>

        <button
          class="calculator__button calculator__button--equal"
          type="button"
          data-action="calculate"
          aria-label="يساوي"
        >
          =
        </button>
      </section>

      <footer class="calculator__footer">
        <span class="calculator__footer-line"></span>
        <p>CRAFTED WITH CODE</p>
        <span class="calculator__footer-line"></span>
      </footer>
    </main>
  </body>
</html>
